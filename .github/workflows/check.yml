# The `npm run check` gate minus REUSE (reuse.yml runs that on its own),
# defined once and called by both CI (pull requests) and Release (version
# tags), so a release is gated exactly like a pull request.
#
# Called with a local path, so a PR is gated by its own version of this file.
name: Check

on: workflow_call

permissions:
  contents: read

jobs:
  check:
    name: Type check & tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The same steps as `npm run check` and the lefthook pre-commit hook, so a
      # commit made with `LEFTHOOK=0` cannot reach main unchecked. One step per
      # tool keeps the failing one visible in the run summary.
      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Unused code
        run: npm run knip

      # Compiles to out/, then the pattern unit tests and the runtime smoke
      # tests against a mocked vscode.
      - name: Run tests
        run: npm test
