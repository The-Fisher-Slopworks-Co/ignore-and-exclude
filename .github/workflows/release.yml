name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # The whole check gate first, the same workflow pull requests run.
  check:
    uses: ./.github/workflows/check.yml
    permissions:
      contents: read

  release:
    name: Build .vsix and publish to Releases
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # No lifecycle scripts: `prepare` would install the git hooks, which a
      # release runner has no use for. `vsce package` compiles on its own
      # through `vscode:prepublish`.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Package the extension
        run: npx --yes @vscode/vsce package --out "ignore-and-exclude-${{ github.ref_name }}.vsix"

      - name: Publish GitHub Release with the .vsix attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "ignore-and-exclude-${{ github.ref_name }}.vsix" \
            --title "${{ github.ref_name }}" \
            --generate-notes
